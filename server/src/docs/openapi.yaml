  '/vendor/collection-slots/{slotId}':
    patch:
      tags: [Vendor Operations]
      summary: Pause or resume one collection slot at an active vendor location
      description: Applied transactionally by a service-role RPC. Started slots and slots with active reservations cannot be changed.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: slotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, vendor_location_id, paused, reason, idempotency_key]
              properties:
                vendor_id: { type: string, format: uuid }
                vendor_location_id: { type: string, format: uuid }
                paused: { type: boolean }
                reason: { type: string, minLength: 1, maxLength: 500 }
                idempotency_key: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200': { description: Slot state applied; unchanged is true when it was already in that state }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Slot or active vendor location was not found }
        '409': { description: Slot has started or still holds reservations }
  '/vendor/reports':
    get:
      tags: [Vendor Operations]
      summary: Read a live, vendor-scoped performance report
      description: Aggregates real orders, retained item snapshots, status history, and settled refunds. Date boundaries and trend buckets are UTC; displayed timestamps use the collection location timezone. Manager only.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: vendor_location_id
          in: query
          description: Limit the report to one active vendor location.
          schema: { type: string, format: uuid }
        - name: range
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, ytd, custom], default: '30d' }
        - name: from
          in: query
          description: Inclusive start date (YYYY-MM-DD) when range is custom.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date (YYYY-MM-DD) when range is custom.
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
      responses:
        '200': { description: Report summary, trend, breakdowns, and one server-paginated orders page }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Active vendor location was not found }
  '/vendor/reports/export':
    get:
      tags: [Vendor Operations]
      summary: Export the vendor report as UTF-8 CSV
      description: Manager only. Uses the same range and location filters as the report, caps at 5000 orders, and writes an attributed audit row.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: vendor_location_id
          in: query
          schema: { type: string, format: uuid }
        - name: range
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, ytd, custom], default: '30d' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: CSV attachment
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  '/vendor/menu/inventory':
    get:
      tags: [Vendor Operations]
      summary: Read one server-paginated page of stock for a vendor collection location
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: vendor_location_id
          in: query
          description: Location to inspect. Defaults to the vendor’s first active location.
          schema: { type: string, format: uuid }
        - name: menu_item_id
          in: query
          description: Limit stock rows to one catalogue item.
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
      responses:
        '200': { description: Paginated stock rows, location options, tracking state, and location-wide counts }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Active vendor location was not found }
    put:
      tags: [Vendor Operations]
      summary: Save stock for every active item at one location
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, vendor_location_id, items, reason, request_id, enable_tracking]
              properties:
                vendor_id: { type: string, format: uuid }
                vendor_location_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
                request_id: { type: string, format: uuid }
                enable_tracking: { type: boolean }
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [menu_item_id, on_hand_quantity]
                    properties:
                      menu_item_id: { type: string, format: uuid }
                      on_hand_quantity: { type: integer, minimum: 0 }
      responses:
        '200': { description: Stock rows saved and tracking setting applied }
        '400': { description: Incomplete or invalid stock payload }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Stock conflict or active reservation prevents the change }
  '/vendor/menu/inventory/settings':
    put:
      tags: [Vendor Operations]
      summary: Enable or disable stock enforcement for one vendor location
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, vendor_location_id, tracking_enabled]
              properties:
                vendor_id: { type: string, format: uuid }
                vendor_location_id: { type: string, format: uuid }
                tracking_enabled: { type: boolean }
      responses:
        '200': { description: Tracking setting updated }
        '409': { description: Setup incomplete or active reservations remain }
        '403': { $ref: '#/components/responses/Forbidden' }
  '/vendor/menu/items/{itemId}/inventory':
    put:
      tags: [Vendor Operations]
      summary: Adjust one catalogue item’s stock at one location
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, vendor_location_id, on_hand_quantity, reason, idempotency_key]
              properties:
                vendor_id: { type: string, format: uuid }
                vendor_location_id: { type: string, format: uuid }
                on_hand_quantity: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 500 }
                idempotency_key: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200': { description: Stock adjusted }
        '409': { description: Stock conflict or duplicate request key }
        '403': { $ref: '#/components/responses/Forbidden' }
  '/vendor/menu/categories':
    get:
      tags: [Vendor Operations]
      summary: List categories belonging to a vendor membership
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        '200': { description: Server-paginated vendor menu categories }
        '403': { $ref: '#/components/responses/Forbidden' }
  '/vendor/menu/metadata-options':
    get:
      tags: [Vendor Operations]
      summary: List active dietary and allergen labels for a vendor manager
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          description: Return only one metadata registry for the active modal section.
          schema: { type: string, enum: [dietary_tag, allergen] }
      responses:
        '200': { description: Active shared dietary tags and allergens }
        '403': { $ref: '#/components/responses/Forbidden' }
  '/vendor/menu/option-groups':
    get:
      tags: [Vendor Operations]
      summary: List paginated active option groups owned by a vendor
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200': { description: One page of option groups and active choices }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vendor Operations]
      summary: Create a vendor-owned option group and choices
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorOptionGroupInput'
      responses:
        '201': { description: Option group created and audited }
        '400': { description: Invalid group or choice data }
        '403': { $ref: '#/components/responses/Forbidden' }
  '/vendor/menu/option-groups/{groupId}':
    patch:
      tags: [Vendor Operations]
      summary: Update or archive a vendor-owned option group
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorOptionGroupInput'
      responses:
        '200': { description: Option group updated and audited }
        '400': { description: Invalid group or choice data }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Option group not found }
  '/vendor/menu/items/{itemId}/configuration':
    get:
      tags: [Vendor Operations]
      summary: Read item configuration, optionally scoped to one section
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: section
          in: query
          description: Return only the active modal section; omit for all configuration.
          schema: { type: string, enum: [dietary, allergens, options] }
      responses:
        '200': { description: Current vendor manager item configuration }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Menu item not found }
    put:
      tags: [Vendor Operations]
      summary: Save item configuration atomically
      description: Send a `section` value of dietary, allergens, or options to update only that section. Omitting section preserves the legacy all-sections update.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                section: { type: string, enum: [dietary, allergens, options] }
                dietary_tag_ids: { type: array, items: { type: string, format: uuid } }
                allergens:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, format: uuid }
                      vendor_notice: { type: string, nullable: true, maxLength: 500 }
                option_group_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { description: Configuration saved and audited }
        '400': { description: Invalid or inactive label/group assignment }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Menu item not found }
  '/vendor/menu/items':
    post:
      tags: [Vendor Operations]
      summary: Create a vendor catalogue item (vendor managers only)
      description: Creates an active vendor catalogue item. It is immediately visible to customers when its status is available or limited; no dated menu is required.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, name, base_price]
              properties:
                vendor_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 2000, nullable: true }
                category_id: { type: string, format: uuid, nullable: true }
                base_price: { type: number, minimum: 0 }
                prep_minutes: { type: integer, minimum: 1, maximum: 1440, nullable: true }
                status: { type: string, enum: [available, limited, sold_out, unavailable] }
                portion_description: { type: string, maxLength: 120, nullable: true }
                ingredients: { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
      responses:
        '201': { description: Catalogue item created }
        '400': { description: Invalid item fields or category }
        '403': { description: Active vendor manager membership is required }
  '/vendor/menu/items/{itemId}':
    patch:
      tags: [Vendor Operations]
      summary: Update a vendor menu item (vendor managers only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 2000, nullable: true }
                category_id: { type: string, format: uuid, nullable: true }
                base_price: { type: number, minimum: 0 }
                prep_minutes: { type: integer, minimum: 1, maximum: 1440, nullable: true }
                status: { type: string, enum: [available, limited, sold_out, unavailable] }
                portion_description: { type: string, maxLength: 120, nullable: true }
                ingredients: { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Menu item updated }
        '403': { description: Active vendor manager membership is required }
        '404': { description: Menu item not found }
    delete:
      tags: [Vendor Operations]
      summary: Archive a vendor menu item (vendor managers only)
      description: Soft-deactivates the item and sets it unavailable, preserving references from historical orders.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Menu item archived }
        '403': { description: Active vendor manager membership is required }
        '404': { description: Menu item not found }
  '/vendor/menu/items/{itemId}/availability':
    patch:
      tags: [Vendor Operations]
      summary: Update catalogue item availability
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [available, limited, sold_out, unavailable] }
      responses:
        '200': { description: Catalogue item availability updated }
        '403': { $ref: '#/components/responses/Forbidden' }

  '/admin/vendors/{vendorId}/menu-items':
    get:
      tags: [Admin Menu Items]
      summary: List menu items for a vendor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [available, limited, sold_out, unavailable] }
        - name: is_active
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200': { description: Paginated menu items }
    post:
      tags: [Admin Menu Items]
      summary: Create a menu item
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VendorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_price]
              properties:
                name: { type: string }
                description: { type: string }
                category_id: { type: string, format: uuid }
                base_price: { type: number }
                currency: { type: string, default: ZAR }
                prep_minutes: { type: integer }
                status: { type: string, enum: [available, limited, sold_out, unavailable] }
                portion_description: { type: string }
                ingredients: { type: array, items: { type: string } }
                image_url: { type: string }
      responses:
        '201': { description: Menu item created }

  '/admin/menu-items/{itemId}':
    patch:
      tags: [Admin Menu Items]
      summary: Update a menu item
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                category_id: { type: string, format: uuid }
                base_price: { type: number }
                status: { type: string, enum: [available, limited, sold_out, unavailable] }
                prep_minutes: { type: integer }
                portion_description: { type: string }
                ingredients: { type: array, items: { type: string } }
                image_url: { type: string }
                is_active: { type: boolean }
      responses:
        '200': { description: Menu item updated }
    delete:
      tags: [Admin Menu Items]
      summary: Delete a menu item
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Menu item deleted }

components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Items per page (max 100)
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Case-insensitive substring search on name/code/address
    IsActive:
      name: is_active
      in: query
      schema:
        type: boolean
      description: Filter by active state (true/false)
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Sort column (resource-specific)
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BuildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FloorId:
      name: floorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CpId:
      name: cpId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DlId:
      name: dlId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MenuItemId:
      name: menuItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Notification id; must belong to the authenticated user
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the access_token from /auth/login response

  schemas:
    AuthResponse:
      type: object
      required:
        - success
        - user
        - session
      properties:
        success:
          type: boolean
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            full_name:
              type: string
            employee_number:
              type: string
            role:
              $ref: '#/components/schemas/AppRole'
            roles:
              type: array
              items:
                $ref: '#/components/schemas/AppRole'
          description: Authenticated user object
        session:
          type: object
          description: Supabase session data with access_token and refresh_token

    UserProfile:
      type: object
      required:
        - id
        - email
        - full_name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        employee_number:
          type: string
        role:
          $ref: '#/components/schemas/AppRole'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AppRole'
        department:
          type: string
        business_unit:
          type: string
        cost_centre:
          type: string
        preferred_site_id:
          type: string
          format: uuid
        preferred_building_id:
          type: string
          format: uuid

    EmployeeProfile:
      type: object
      description: Full self-service profile. Sensitive fields are returned only to the owner.
      required:
        - id
        - email
        - full_name
        - is_active
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
          maxLength: 120
        employee_number:
          type: string
          nullable: true
          readOnly: true
        department:
          type: string
          nullable: true
          readOnly: true
        business_unit:
          type: string
          nullable: true
          readOnly: true
        cost_centre:
          type: string
          nullable: true
          readOnly: true
        preferred_site_id:
          type: string
          format: uuid
          nullable: true
        preferred_building_id:
          type: string
          format: uuid
          nullable: true
        dietary_preferences:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
        allergy_indicators:
          type: array
          maxItems: 50
          description: Personal indicators, not an allergen-safety guarantee.
          items:
            type: string
            maxLength: 100
        notification_preferences:
          type: object
          properties:
            transactional:
              type: boolean
              readOnly: true
              description: Always true; required order messages cannot be disabled.
            order_updates:
              type: boolean
            promotions:
              type: boolean
            collection_reminders:
              type: boolean
            onboarding_completed:
              type: boolean
              description: App-managed onboarding state, not a user preference toggle.
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ProfilePatch:
      type: object
      description: >
        Allowlisted partial profile update. Any other property, including an id,
        email, status, role, or timestamp, is rejected with 400.
      additionalProperties: false
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        preferred_site_id:
          type: string
          format: uuid
          nullable: true
        preferred_building_id:
          type: string
          format: uuid
          nullable: true
          description: Must belong to the selected active site; clearing the site clears this value.
        dietary_preferences:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
        allergy_indicators:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
        notification_preferences:
          type: object
          additionalProperties: false
          description: >
            Optional keys may be patched. transactional is server-managed and
            will be rejected if supplied; unknown stored keys are preserved.
          properties:
            order_updates:
              type: boolean
            promotions:
              type: boolean
            collection_reminders:
              type: boolean
            onboarding_completed:
              type: boolean
              description: App-managed onboarding state; accepted only through this canonical API.

    ProfileAccess:
      type: object
      required:
        - success
        - roles
        - platformRoles
        - vendorRoles
        - vendorMemberships
      properties:
        success:
          type: boolean
          example: true
        roles:
          type: array
          description: Effective union of platform and active vendor roles.
          items:
            $ref: '#/components/schemas/AppRole'
        platformRoles:
          type: array
          description: Roles persisted in user_roles.
          items:
            $ref: '#/components/schemas/AppRole'
        vendorRoles:
          type: array
          description: Roles derived from active vendor_users memberships.
          items:
            $ref: '#/components/schemas/AppRole'
        vendorMemberships:
          type: array
          items:
            $ref: '#/components/schemas/VendorMembership'

    FavoriteState:
      type: object
      required:
        - success
        - vendorIds
        - menuItemIds
      properties:
        success:
          type: boolean
          example: true
        vendorIds:
          type: array
          items:
            type: string
            format: uuid
        menuItemIds:
          type: array
          items:
            type: string
            format: uuid

    FavoriteVendor:
      type: object
      required:
        - vendor
        - favoritedAt
      properties:
        vendor:
          $ref: '#/components/schemas/Vendor'
        favoritedAt:
          type: string
          format: date-time

    FavoriteMenuItem:
      type: object
      required:
        - menuItem
        - favoritedAt
      properties:
        menuItem:
          type: object
          required:
            - id
            - name
            - base_price
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            image_url:
              type: string
              nullable: true
            base_price:
              type: number
            status:
              type: string
              enum: [available, limited, sold_out, unavailable]
              description: Global sale gate. Unavailable favourites remain removable.
            is_active:
              type: boolean
            vendor:
              $ref: '#/components/schemas/Vendor'
        favoritedAt:
          type: string
          format: date-time

    PaginatedFavorites:
      type: object
      required:
        - success
        - favorites
        - pagination
      properties:
        success:
          type: boolean
          example: true
        favorites:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'

    PaginatedFavoriteVendors:
      allOf:
        - $ref: '#/components/schemas/PaginatedFavorites'
        - type: object
          properties:
            favorites:
              type: array
              items:
                $ref: '#/components/schemas/FavoriteVendor'

    PaginatedFavoriteMenuItems:
      allOf:
        - $ref: '#/components/schemas/PaginatedFavorites'
        - type: object
          properties:
            favorites:
              type: array
              items:
                $ref: '#/components/schemas/FavoriteMenuItem'

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        employee_number:
          type: string
        department:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          description: Effective roles, including vendor roles derived from active memberships.
          items:
            $ref: '#/components/schemas/AppRole'
        platformRoles:
          type: array
          description: Roles stored in user_roles.
          items:
            $ref: '#/components/schemas/AppRole'
        vendorRoles:
          type: array
          description: Roles derived from active vendor_users memberships.
          items:
            $ref: '#/components/schemas/AppRole'

    RoleDetail:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/AppRole'
        granted_by:
          type: string
          format: uuid
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

    VendorMembership:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        vendorName:
          type: string
          nullable: true
          description: Display name of the vendor, when available.
        role:
          type: string
          enum:
            - staff
            - manager
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    AppRole:
      type: string
      enum:
        - employee
        - executive
        - executive_assistant
        - meeting_organiser
        - training_coordinator
        - cost_centre_owner
        - vendor_staff
        - vendor_manager
        - admin
        - finance
        - support
        - auditor

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Notification:
      type: object
      required:
        - id
        - eventKey
        - category
        - level
        - title
        - body
        - isRead
      properties:
        id: { type: string, format: uuid }
        eventKey: { type: string, description: Server-owned catalog key }
        category:
          type: string
          enum: [order, payment, cart, vendor, promotion, account, system]
          description: Derived from the event catalog, never from client input
        level:
          type: string
          enum: [info, warning, alert]
          description: Per-notification severity from the event catalog
        orderId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body: { type: string }
        metadata:
          type: object
          description: Server-generated category, level, actionPath and dispatch context
          additionalProperties: true
        channel:
          type: string
          enum: [in_app, push, email, sms]
        status:
          type: string
          enum: [pending, sent, read, failed]
        sentAt: { type: string, format: date-time, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        isRead: { type: boolean }

    NotificationListResponse:
      type: object
      required: [success, notifications, unreadCount, level, pagination]
      properties:
        success: { type: boolean, example: true }
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unreadCount: { type: integer, minimum: 0 }
        level:
          type: string
          enum: [none, info, warning, alert]
          description: Bell level derived from all unread notifications
        pagination:
          $ref: '#/components/schemas/Pagination'

    NotificationPreferences:
      type: object
      required:
        - transactional
