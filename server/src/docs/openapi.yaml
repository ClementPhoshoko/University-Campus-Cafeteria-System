          type: string
          description: Short campus code (unique, optional, [A-Z0-9_-])
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: Valid IANA timezone
