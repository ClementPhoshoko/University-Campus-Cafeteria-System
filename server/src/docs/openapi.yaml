        is_active:
          type: boolean
        floor:
          type: object
          nullable: true
          properties:
            name:
              type: string
            level_number:
              type: integer

    CollectionPointInput:
      type: object
      properties:
        name:
          type: string
          description: Collection point name (unique per building, required on create)
        floor_id:
          type: string
          format: uuid
