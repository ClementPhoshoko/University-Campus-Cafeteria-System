                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Items per page (max 100)
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Case-insensitive substring search on name/code/address
    IsActive:
      name: is_active
      in: query
      schema:
        type: boolean
      description: Filter by active state (true/false)
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Sort column (resource-specific)
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BuildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FloorId:
      name: floorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CpId:
      name: cpId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DlId:
      name: dlId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the access_token from /auth/login response

  schemas:
    AuthResponse:
      type: object
      required:
        - success
        - user
        - session
      properties:
        success:
          type: boolean
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            full_name:
              type: string
            employee_number:
              type: string
            role:
              $ref: '#/components/schemas/AppRole'
            roles:
              type: array
              items:
                $ref: '#/components/schemas/AppRole'
          description: Authenticated user object
        session:
          type: object
          description: Supabase session data with access_token and refresh_token

    UserProfile:
      type: object
      required:
        - id
        - email
        - full_name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        employee_number:
          type: string
        role:
          $ref: '#/components/schemas/AppRole'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AppRole'
        department:
          type: string
        business_unit:
          type: string
        cost_centre:
          type: string
        preferred_site_id:
          type: string
          format: uuid
        preferred_building_id:
          type: string
          format: uuid

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        employee_number:
          type: string
        department:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AppRole'

    RoleDetail:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/AppRole'
        granted_by:
          type: string
          format: uuid
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

    AppRole:
      type: string
      enum:
        - employee
        - executive
        - executive_assistant
        - meeting_organiser
        - training_coordinator
        - cost_centre_owner
        - vendor_staff
        - vendor_manager
        - admin
        - finance
        - support
        - auditor

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Site:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        timezone:
          type: string
          example: Africa/Johannesburg
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SiteWithCounts:
      allOf:
        - $ref: '#/components/schemas/Site'
        - type: object
          properties:
            building_count:
              type: integer
            collection_point_count:
              type: integer
            vendor_count:
              type: integer

    SiteInput:
      type: object
      properties:
        name:
          type: string
          description: Campus name (unique, required on create)
        code:
          type: string
          description: Short campus code (unique, optional, [A-Z0-9_-])
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: Valid IANA timezone
          example: Africa/Johannesburg
        is_active:
          type: boolean

    Building:
      type: object
      required:
        - id
        - site_id
        - name
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BuildingWithCounts:
      allOf:
        - $ref: '#/components/schemas/Building'
        - type: object
          properties:
            floor_count:
              type: integer
            collection_point_count:
              type: integer

    BuildingInput:
      type: object
      properties:
        name:
          type: string
          description: Building name (unique per site, required on create)
        code:
          type: string
          description: Building code (unique per site, optional)
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        is_active:
          type: boolean

    Floor:
      type: object
      required:
        - id
        - building_id
        - name
      properties:
        id:
          type: string
          format: uuid
        building_id:
          type: string
          format: uuid
        name:
          type: string
        level_number:
          type: integer
          nullable: true
        is_active:
          type: boolean

    FloorInput:
      type: object
      properties:
        name:
          type: string
          description: Floor name (unique per building, required on create)
        level_number:
          type: integer
        is_active:
          type: boolean

    CollectionPoint:
      type: object
      required:
        - id
        - building_id
        - name
      properties:
        id:
          type: string
          format: uuid
        building_id:
          type: string
          format: uuid
        floor_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        instructions:
          type: string
          nullable: true
        is_express:
          type: boolean
          default: true
        is_active:
          type: boolean
        floor:
          type: object
          nullable: true
          properties:
            name:
              type: string
            level_number:
              type: integer

    CollectionPointInput:
      type: object
      properties:
        name:
          type: string
          description: Collection point name (unique per building, required on create)
        floor_id:
          type: string
          format: uuid
          description: Must belong to the same building
        instructions:
          type: string
        is_express:
          type: boolean
        is_active:
          type: boolean

    DeliveryLocation:
      type: object
      required:
        - id
        - building_id
        - name
      properties:
        id:
          type: string
          format: uuid
        building_id:
          type: string
          format: uuid
        floor_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        room_or_venue:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        is_active:
          type: boolean
        floor:
          type: object
          nullable: true
          properties:
            name:
              type: string
            level_number:
              type: integer

    DeliveryLocationInput:
      type: object
      properties:
        name:
          type: string
          description: Delivery location name (unique per building, required on create)
        floor_id:
          type: string
          format: uuid
          description: Must belong to the same building
        room_or_venue:
          type: string
        instructions:
          type: string
        is_active:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    Vendor:
      type: object
      required:
        - id
        - name
        - slug
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, suspended, inactive, rejected]
        support_email:
          type: string
          nullable: true
        support_phone:
          type: string
          nullable: true
        corporate_catering_enabled:
          type: boolean
        average_rating:
          type: number
          nullable: true
        rating_count:
          type: integer
        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          type: string
          format: uuid
          nullable: true
        location_count:
          type: integer
          description: Number of locations (list responses)
        location:
          $ref: '#/components/schemas/VendorLocationSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorLocationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_status:
          type: string
        is_active:
          type: boolean
        site_name:
          type: string
          nullable: true
        building_name:
          type: string
          nullable: true
        collection_point_name:
          type: string
          nullable: true

    VendorDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        corporate_catering_enabled:
          type: boolean
        average_rating:
          type: number
          nullable: true
        rating_count:
          type: integer
        locations:
          type: array
          items:
            $ref: '#/components/schemas/VendorLocation'

    VendorInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Vendor name (used to derive the slug)
        description:
          type: string
        logo_url:
          type: string
          format: uri
        support_email:
          type: string
          format: email
        support_phone:
          type: string
        corporate_catering_enabled:
          type: boolean
        onboarding_key:
          type: string
          description: Client-generated idempotency key. Ignored on patch.
        location:
          $ref: '#/components/schemas/VendorLocationInput'
          description: Optional initial location created together with the application

    OperatingHoursItem:
      type: object
      required:
        - day_of_week
      properties:
        id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type: string
          format: time
          nullable: true
          description: Required when is_closed is false
        closes_at:
          type: string
          format: time
          nullable: true
        is_closed:
          type: boolean
          default: false

    OperatingHoursInput:
      type: array
      items:
        type: object
        required:
          - day_of_week
        properties:
          day_of_week:
            type: integer
            minimum: 0
            maximum: 6
          opens_at:
            type: string
            format: time
            description: Required together with closes_at when the day is open
          closes_at:
            type: string
            format: time
          is_closed:
            type: boolean
            default: false
      uniqueItems: true

    VendorLocation:
      type: object
      required:
        - id
        - vendor_id
        - site_id
        - building_id
      properties:
        id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        building_id:
          type: string
          format: uuid
        collection_point_id:
          type: string
          format: uuid
          nullable: true
        service_status:
          type: string
          enum: [closed, open, busy, temporarily_unavailable]
        order_cutoff_minutes:
          type: integer
          nullable: true
        estimated_prep_minutes:
          type: integer
          nullable: true
        collection_instructions:
          type: string
          nullable: true
        is_active:
          type: boolean
        site_name:
          type: string
          nullable: true
        building_name:
          type: string
          nullable: true
        collection_point_name:
          type: string
          nullable: true
        hours:
          type: array
          items:
            $ref: '#/components/schemas/OperatingHoursItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorLocationInput:
      type: object
      required:
        - site_id
        - building_id
      properties:
        site_id:
          type: string
          format: uuid
        building_id:
          type: string
          format: uuid
          description: Must belong to site_id
        collection_point_id:
          type: string
          format: uuid
          description: Must belong to building_id
        service_status:
          type: string
          enum: [closed, open, busy, temporarily_unavailable]
          default: closed
        order_cutoff_minutes:
          type: integer
          minimum: 0
        estimated_prep_minutes:
          type: integer
          minimum: 1
        collection_instructions:
          type: string
        is_active:
          type: boolean
        hours:
          $ref: '#/components/schemas/OperatingHoursInput'
          description: Full replace of operating hours on update

    VendorApprovalInput:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum: [approve, reject, suspend, activate]
        reason:
          type: string
          description: Required when decision is reject

    VendorUser:
      type: object
      required:
        - user_id
        - vendor_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [staff, manager]
        is_active:
          type: boolean
        granted_by:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          nullable: true
        full_name:
          type: string
          nullable: true
        employee_number:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    VendorUserInput:
      type: object
      oneOf:
        - required: [user_id]
        - required: [email]
      properties:
        user_id:
          type: string
          format: uuid
          description: Must not be combined with email
        email:
          type: string
          format: email
        role:
          type: string
          enum: [staff, manager]
          default: staff

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        table_name:
          type: string
        record_key:
          type: string
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: A record with these values already exists or the action conflicts with the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - bearerAuth: []
