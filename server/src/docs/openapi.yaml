        - name: category
          in: query
          schema: { type: string, enum: [data, access, config, lifecycle] }
        - name: actor_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
