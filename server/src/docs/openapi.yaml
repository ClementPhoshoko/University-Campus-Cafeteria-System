          type: number
          nullable: true
        rating_count:
          type: integer
        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          type: string
          format: uuid
          nullable: true
        location_count:
          type: integer
          description: Number of locations (list responses)
        service_status:
          type: string
          enum: [open, busy, closed, temporarily_unavailable]
