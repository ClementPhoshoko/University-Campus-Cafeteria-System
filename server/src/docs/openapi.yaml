openapi: 3.0.1
info:
  title: Merchant Munchies API
  version: 0.1.0
  description: Workplace food-ordering platform API - Merchant Place Pilot
  contact:
    name: Merchant Munchies Team
    email: support@merchantmunnies.local
servers:
  - url: http://localhost:4000/api/v1
    description: Development server
  - url: https://api.merchantmunnies.local/api/v1
    description: Production server
tags:
  - name: Authentication
    description: Authenticate and manage user sessions
  - name: Profile
    description: User profile management
  - name: Sites
    description: Site and building management
  - name: Vendors
    description: Vendor/outlet management
  - name: Menus
    description: Menu items and categories
  - name: Search
    description: Search meals and vendors
  - name: Cart
    description: Shopping cart management
  - name: Collection Slots
    description: Collection time slot management
  - name: Orders
    description: Order lifecycle management
  - name: Payments
    description: Payment processing and refunds
  - name: Notifications
    description: Notification preferences and events
  - name: Favorites
    description: Favorite vendors and meals
  - name: Feedback
    description: Ratings and complaints
  - name: Vendor Operations
    description: Vendor dashboard APIs
  - name: Administration
    description: Admin portal APIs
  - name: Corporate Catering
    description: Corporate ordering and approvals
  - name: Reports
    description: Reporting and analytics

paths:
  '/health':
    get:
      tags:
        - Authentication
      summary: Health check
      description: API health check endpoint
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    type: string
                  status:
                    type: string
                  timestamp:
                    type: string

  '/auth/login':
    post:
      tags:
        - Authentication
      summary: Employee login
      description: Authenticate employee with email and password. Returns JWT access token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Employee email or employee number
                password:
                  type: string
                  description: Password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials

  '/auth/logout':
    post:
      tags:
        - Authentication
      summary: Employee logout
      description: Revoke current session. Requires valid JWT.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized - invalid or missing token

  '/auth/refresh':
    post:
      tags:
        - Authentication
      summary: Refresh session
      description: Refresh access token using current JWT. Requires valid JWT.
      operationId: refresh
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session refreshed
        '401':
          description: Unauthorized - invalid or missing token

  '/auth/me':
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Fetch authenticated user profile with roles. Requires valid JWT.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized - invalid or missing token

  '/admin/users':
    get:
      tags:
        - Administration
      summary: List users
      description: Retrieve a paginated list of users with their assigned roles. Requires admin role.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Items per page
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, email, or employee number
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/AppRole'
          description: Filter by role
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Server error

  '/admin/users/{userId}/roles':
    get:
      tags:
        - Administration
      summary: Get user roles
      description: Retrieve all roles assigned to a specific user. Requires admin role.
      operationId: getUserRoles
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User roles retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/AdminUser'
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppRole'
                  roleDetails:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Administration
      summary: Set user roles
      description: Replace all roles for a user. Cannot remove your own admin role. Requires admin role.
      operationId: setUserRoles
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roles
              properties:
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/AppRole'
                  example: [admin, finance]
      responses:
        '200':
          description: Roles updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                    format: uuid
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Administration
      summary: Add role to user
      description: Add a single role to a user. Requires admin role.
      operationId: addRole
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: '#/components/schemas/AppRole'
      responses:
        '200':
          description: Role added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                    format: uuid
                  role:
                    $ref: '#/components/schemas/AppRole'
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  '/admin/users/{userId}/roles/{role}':
    delete:
      tags:
        - Administration
      summary: Remove role from user
      description: Remove a single role from a user. Cannot remove your own admin role. Requires admin role.
      operationId: removeRole
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppRole'
      responses:
        '200':
          description: Role removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                    format: uuid
                  removedRole:
                    $ref: '#/components/schemas/AppRole'
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  '/email/supabase-hook':
    post:
      tags:
        - Notifications
      summary: Supabase Send Email Hook
      description: Webhook endpoint called by Supabase to send auth emails (signup, magic link, recovery). Verified by webhook signature.
      operationId: handleSendEmailHook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user
                - email_data
              properties:
                user:
                  type: object
                  required:
                    - email
                  properties:
                    email:
                      type: string
                      format: email
                    user_metadata:
                      type: object
                email_data:
                  type: object
                  required:
                    - email_action_type
                  properties:
                    email_action_type:
                      type: string
                      enum: [signup, magiclink, recovery, email_change]
                    token_hash:
                      type: string
                    redirect_to:
                      type: string
                    token:
                      type: string
                      description: OTP token for recovery emails
      responses:
        '200':
          description: Email sent
        '400':
          description: Invalid payload
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/email/resend-verification':
    post:
      tags:
        - Authentication
      summary: Resend verification email
      description: Resend the signup verification email. Requires valid JWT.
      operationId: handleResendVerification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email resent
        '400':
          description: Email is required
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/email/welcome':
    post:
      tags:
        - Notifications
      summary: Send welcome email
      description: Send a branded welcome email to an employee. Requires admin role.
      operationId: sendWelcomeEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  format: email
                userName:
                  type: string
      responses:
        '200':
          description: Welcome email sent
        '400':
          description: Email is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  '/email/order-confirmed':
    post:
      tags:
        - Orders
      summary: Send order confirmed email
      description: Send order confirmation to a customer. Requires valid JWT.
      operationId: sendOrderConfirmedEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - orderNumber
              properties:
                to:
                  type: string
                  format: email
                orderNumber:
                  type: string
                vendorName:
                  type: string
                collectionTime:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                total:
                  type: number
      responses:
        '200':
          description: Order confirmation sent
        '400':
          description: Email is required
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/email/order-ready':
    post:
      tags:
        - Orders
      summary: Send order ready email
      description: Notify the customer that their order is ready. Requires valid JWT.
      operationId: sendOrderReadyEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - orderNumber
              properties:
                to:
                  type: string
                  format: email
                orderNumber:
                  type: string
                vendorName:
                  type: string
                collectionTime:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                total:
                  type: number
      responses:
        '200':
          description: Order ready email sent
        '400':
          description: Email is required
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/sites':
    get:
      tags:
        - Sites
      summary: List campuses
      description: List active campus sites for employees. Paginated, searchable.
      operationId: listPublicSites
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Active sites retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/sites/{siteId}':
    get:
      tags:
        - Sites
      summary: Get campus detail
      description: Get a single active campus site. Requires a valid session.
      operationId: getPublicSite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  site:
                    $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/sites/{siteId}/buildings':
    get:
      tags:
        - Sites
      summary: List campus buildings
      description: List active buildings for a campus site. Paginated. Requires a valid session.
      operationId: listPublicBuildings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Buildings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  site_id:
                    type: string
                    format: uuid
                  buildings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/buildings/{buildingId}/floors':
    get:
      tags:
        - Sites
      summary: List building floors
      description: List active floors for a building. Requires a valid session.
      operationId: listPublicFloors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: Floors retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  building_id:
                    type: string
                    format: uuid
                  floors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Floor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/buildings/{buildingId}/collection-points':
    get:
      tags:
        - Sites
      summary: List collection points
      description: List active collection points for a building. Requires a valid session.
      operationId: listPublicCollectionPoints
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: Collection points retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  building_id:
                    type: string
                    format: uuid
                  collectionPoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionPoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/admin/sites':
    get:
      tags:
        - Administration
      summary: List sites (admin)
      description: Paginated list of campus sites with building/collection-point/vendor counts. Requires admin role.
      operationId: listSites
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Sites retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sites:
                    type: array
                    items:
                      $ref: '#/components/schemas/SiteWithCounts'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Administration
      summary: Register a campus site
      description: Create a new campus site. Requires admin role. Unique name/code rejected with 409.
      operationId: createSite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteInput'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  site:
                    $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate name or code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  '/admin/sites/{siteId}':
    get:
      tags:
        - Administration
      summary: Get site detail (admin)
      description: Get one campus site with counts. Requires admin role.
      operationId: getSite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  site:
                    $ref: '#/components/schemas/SiteWithCounts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Administration
      summary: Update a campus site
      description: Partial update of a campus site. Toggle is_active to activate/deactivate. Requires admin role.
      operationId: updateSite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteInput'
      responses:
        '200':
          description: Site updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  site:
                    $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate name or code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  '/admin/sites/{siteId}/buildings':
    get:
      tags:
        - Administration
      summary: List buildings for a site
      description: Paginated list of buildings for a campus site with floor/collection-point counts. Requires admin role.
      operationId: listBuildings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Buildings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  site_id:
                    type: string
                    format: uuid
                  buildings:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuildingWithCounts'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Administration
      summary: Register a building
      description: Create a building under a campus site. Name/code unique per site; duplicates rejected with 409.
      operationId: createBuilding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '201':
          description: Building created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  building:
                    $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate name or code within the site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  '/admin/buildings/{buildingId}':
    get:
      tags:
        - Administration
      summary: Get building detail
      description: Get one building with floor/collection-point counts. Requires admin role.
      operationId: getBuilding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: Building retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  building:
                    $ref: '#/components/schemas/BuildingWithCounts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Administration
      summary: Update a building
      description: Partial update of a building. Changes cannot move a building to another site. Requires admin role.
      operationId: updateBuilding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '200':
