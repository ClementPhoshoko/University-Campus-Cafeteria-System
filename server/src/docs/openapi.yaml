openapi: 3.0.1
info:
  title: Merchant Munchies API
  version: 0.1.0
  description: Workplace food-ordering platform API - Merchant Place Pilot
  contact:
    name: Merchant Munchies Team
    email: support@merchantmunnies.local
servers:
  - url: http://localhost:4000/api/v1
    description: Development server
  - url: https://api.merchantmunnies.local/api/v1
    description: Production server
tags:
  - name: Authentication
    description: Authenticate and manage user sessions
  - name: Profile
    description: User profile management
  - name: Sites
    description: Site and building management
  - name: Vendors
    description: Vendor/outlet management
  - name: Assets
    description: Signed image URL management
  - name: Menus
    description: Menu items and categories
  - name: Search
    description: Search meals and vendors
  - name: Cart
    description: Shopping cart management
  - name: Collection Slots
    description: Collection time slot management
  - name: Orders
    description: Order lifecycle management
  - name: Payments
    description: Payment processing and refunds
  - name: Notifications
    description: Notification preferences and events
  - name: Favorites
    description: Favorite vendors and meals
  - name: Feedback
    description: Ratings and complaints
  - name: Vendor Operations
    description: Vendor dashboard APIs
  - name: Administration
    description: Admin portal APIs
  - name: Corporate Catering
    description: Corporate ordering and approvals
  - name: Reports
    description: Reporting and analytics

paths:
  '/health':
    get:
      tags:
        - Authentication
      summary: Health check
      description: API health check endpoint
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    type: string
                  status:
                    type: string
                  timestamp:
                    type: string

  '/cart':
    get:
      tags:
        - Cart
      summary: Get the authenticated user's active carts
      description: Returns one active cart per vendor location, each with its own items, totals, readable pickup location, and collection slots. The worker sends a best-effort reminder during the final 20 minutes, then clears cart items and marks the cart expired.
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active vendor-location carts (empty when there are none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  carts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        vendor:
                          type: object
                        vendorLocationId:
                          type: string
                          format: uuid
                        pickupLocation:
                          type: string
                          description: Site, building, and collection point for this cart.
                        items:
                          type: array
                          items:
                            type: object
                        collectionSlots:
                          type: array
                          items:
                            type: object
                        subtotal:
                          type: number
                        serviceFee:
                          type: number
                        total:
                          type: number
                        itemCount:
                          type: integer
                  cart:
                    description: First cart retained for compatibility with older clients.
                    nullable: true
                    type: object
                    properties:
                      expiresAt:
                        type: string
                        format: date-time
                      items:
                        type: array
                        items:
                          type: object
                      subtotal:
                        type: number
                      serviceFee:
                        type: number
                      total:
                        type: number
                      itemCount:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/cart/items':
    post:
      tags:
        - Cart
      summary: Add an item to the active cart
      description: Adds to the user's active cart for the item's vendor location without affecting other vendor carts. The server validates option rules and prices. Different customizations or instructions for the same menu item are kept as separate cart lines.
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - menuItemId
                - vendorLocationId
              properties:
                menuItemId:
                  type: string
                  format: uuid
                vendorLocationId:
                  type: string
                  format: uuid
                  description: Active location selected by the employee for this vendor
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                options:
                  type: array
                  items:
                    type: object
                    required:
                      - optionId
                    properties:
                      optionId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                specialInstructions:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Cart line created
        '200':
          description: Matching cart line quantity increased
        '400':
          description: Invalid item, option selection, or quantity
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/orders':
    get:
      tags:
        - Orders
      summary: List the current employee's orders
      description: Returns paginated orders with their support reference, vendor, item names and quantities, and the collection code only after the order is ready for collection.
      operationId: listMyOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, cancelled]
      responses:
        '200':
          description: Customer orders retrieved
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Orders
      summary: Create an order from one vendor-location cart
      description: Order line items, prices, and customizations are read exclusively from the identified active cart owned by the authenticated user. Checkout creates one order for one vendor location. Client-supplied non-empty items are rejected.
      operationId: createOrderFromCart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cartId
                - vendorId
                - vendorLocationId
                - collectionSlotId
              properties:
                cartId:
                  type: string
                  format: uuid
                vendorId:
                  type: string
                  format: uuid
                vendorLocationId:
                  type: string
                  format: uuid
                collectionSlotId:
                  type: string
                  format: uuid
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Order created from the active cart
        '400':
          description: Empty cart, cart mismatch, or invalid checkout data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Cart expired

  '/corporate/requests':
    post:
      tags: [Orders]
      summary: Create a cost-centre catering request
      description: Creates a real corporate order with retained item snapshots, a succeeded internal cost-centre payment, a pending approval step, and an attributed audit row. Requires a requester role. Standard service-fee rules apply. Migration 031 must be applied first.
      operationId: createCorporateRequest
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, vendor_location_id, items, event_name, venue, attendee_count, meeting_start_at, meeting_end_at, required_delivery_at, cost_centre]
              properties:
                vendor_id: { type: string, format: uuid }
                vendor_location_id: { type: string, format: uuid }
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [menuItemId, quantity]
                    properties:
                      menuItemId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 500 }
                event_name: { type: string, minLength: 1, maxLength: 160 }
                venue: { type: string, minLength: 1, maxLength: 200 }
                attendee_count: { type: integer, minimum: 1, maximum: 20000 }
                meeting_start_at: { type: string, format: date-time }
                meeting_end_at: { type: string, format: date-time }
                required_delivery_at: { type: string, format: date-time }
                cost_centre: { type: string, minLength: 1, maxLength: 120 }
                department: { type: string, maxLength: 120 }
                business_unit: { type: string, maxLength: 120 }
                purchase_order_number: { type: string, maxLength: 120 }
                dietary_requirements: { type: array, items: { type: string } }
                allergy_requirements: { type: array, items: { type: string } }
                delivery_setup_requirements: { type: string, maxLength: 2000 }
                special_instructions: { type: string, maxLength: 2000 }
                on_behalf_of_user_id: { type: string, format: uuid }
      responses:
        '201': { description: Corporate request created with pending approval }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Vendor, location, menu items, or request state is unavailable }
    get:
      tags: [Orders]
      summary: List the current requester's corporate catering requests
      operationId: listMyCorporateRequests
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Server-paginated corporate requests }
        '403': { $ref: '#/components/responses/Forbidden' }

  '/corporate/requests/{orderId}':
    get:
      tags: [Orders]
      summary: Get one corporate request owned by the current requester
      operationId: getMyCorporateRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Request, order totals, items, approval steps, quotes, and delivery }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Request was not found for this requester }

  '/corporate/approvals/pending':
    get:
      tags: [Corporate Catering]
      summary: List pending corporate approvals
      operationId: listPendingCorporateRequests
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Server-paginated pending approvals }
        '403': { $ref: '#/components/responses/Forbidden' }

  '/corporate/approvals/{orderId}':
    get:
      tags: [Corporate Catering]
      summary: Read a corporate request for approval review
      operationId: getCorporateRequestForApproval
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Approval review detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Corporate request not found }

  '/corporate/approvals/{orderId}/decision':
    post:
      tags: [Corporate Catering]
      summary: Approve, reject, or request an amendment
      description: Admin or finance only. Rejections require comments. The RPC locks the approval row, updates the order state, and writes an attributed audit row atomically.
      operationId: decideCorporateApproval
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected, amendment_requested] }
                comments: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Decision applied }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Request was already decided or approval step is not pending }

  '/orders/{orderId}':
    get:
      tags:
        - Orders
      summary: Get an order owned by the current employee
      description: Returns order items, status history, collection point name and instructions, and the selected collection slot. The collection code is included only when the order is ready for collection or has been collected/completed.
      operationId: getMyOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details retrieved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found for the current employee

  '/orders/{orderId}/mock-payment':
    post:
      tags:
        - Orders
      summary: Simulate a development checkout payment
      description: Development-only payment simulator. It never collects card details or moves money. A successful outcome confirms the order for the vendor queue; a failed outcome leaves checkout retryable; cancellation cancels the pending order and releases its collection slot.
      operationId: processMockPayment
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [succeeded, failed, cancelled]
      responses:
        '200':
          description: Simulated payment outcome recorded
        '400':
          description: Invalid payment outcome
        '404':
          description: Order not found or simulator disabled
        '409':
          description: Order is no longer payable
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/auth/login':
    post:
      tags:
        - Authentication
      summary: Employee login
      description: Authenticate employee with email and password. Returns JWT access token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Employee email or employee number
                password:
                  type: string
                  description: Password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials

  '/auth/logout':
    post:
      tags:
        - Authentication
      summary: Employee logout
      description: Revoke current session. Requires valid JWT.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized - invalid or missing token

  '/auth/refresh':
    post:
      tags:
        - Authentication
      summary: Refresh session
      description: Refresh access token using current JWT. Requires valid JWT.
      operationId: refresh
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session refreshed
        '401':
          description: Unauthorized - invalid or missing token

  '/auth/me':
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Fetch authenticated user profile with roles. Requires valid JWT.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - user
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized - invalid or missing token

  '/profile':
    get:
      tags:
        - Profile
      summary: Get the authenticated employee's full profile
      description: >
        Read the caller's profile. The user id is derived from the access token;
        query parameters and body values cannot select another user. Allergy and
        dietary data is sensitive, so responses are not cached.
      operationId: getEmployeeProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Full profile retrieved
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - profile
                properties:
                  success:
                    type: boolean
                    example: true
                  profile:
                    $ref: '#/components/schemas/EmployeeProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Profile
      summary: Update the authenticated employee's profile
      description: >
        Partially update the caller's profile. Only the documented self-service
        fields are accepted; identity, status, role, and timestamp fields are
        rejected. The response is not cached and includes the refreshed profile.
      operationId: updateEmployeeProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - profile
                properties:
                  success:
                    type: boolean
                    example: true
                  profile:
                    $ref: '#/components/schemas/EmployeeProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/profile/access':
    get:
      tags:
        - Profile
      summary: Get the authenticated employee's effective roles
      description: >
        Read-only platform roles plus vendor roles derived from active vendor
        memberships. This endpoint never grants or persists roles.
      operationId: getEmployeeProfileAccess
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective access retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/notifications':
    get:
      tags:
        - Notifications
      summary: List the authenticated user's notifications
      description: >
        Server-paginated in-app notification inbox. Email rows are delivery
        records and are excluded. The user id is derived from the access token
        only. Category and bell level come from the server-owned event catalog,
        never from query parameters.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, unread, read]
            default: all
          description: Read-state filter
        - name: q
          in: query
          schema:
            type: string
          description: Sanitised case-insensitive title/body search applied server-side
        - name: eventKey
          in: query
          schema:
            type: string
          description: Optional exact event-key filter
        - name: orderId
          in: query
          schema:
            type: string
            format: uuid
          description: Optional exact order-id filter
      responses:
        '200':
          description: One page of notifications plus the unread bell state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Notification centre is not configured on this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  '/notifications/unread-count':
    get:
      tags:
        - Notifications
      summary: Get the unread count and bell level
      operationId: getNotificationUnreadCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count and derived bell level
          content:
            application/json:
              schema:
                type: object
                required: [success, unreadCount, level]
                properties:
                  success: { type: boolean, example: true }
                  unreadCount: { type: integer, minimum: 0 }
                  level:
                    type: string
                    enum: [none, info, warning, alert]
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/notifications/read-all':
    patch:
      tags:
        - Notifications
      summary: Mark all of the user's unread notifications as read
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                required: [success, updated]
                properties:
                  success: { type: boolean, example: true }
                  updated: { type: integer, minimum: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/notifications/read':
    delete:
      tags:
        - Notifications
      summary: Delete all of the user's read notifications
      operationId: clearReadNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of notifications deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, deleted]
                properties:
                  success: { type: boolean, example: true }
                  deleted: { type: integer, minimum: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  '/notifications/{notificationId}/read':
    patch:
      tags:
        - Notifications
      summary: Mark one notification as read
      description: Idempotent. The notification must belong to the authenticated user.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                required: [success, notification]
                properties:
                  success: { type: boolean, example: true }
                  notification:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/notifications/{notificationId}/unread':
    patch:
      tags:
        - Notifications
      summary: Mark one notification as unread
      description: Idempotent. The notification must belong to the authenticated user.
      operationId: markNotificationUnread
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                required: [success, notification]
                properties:
                  success: { type: boolean, example: true }
                  notification:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/notifications/{notificationId}':
    delete:
      tags:
        - Notifications
      summary: Delete one notification
      description: The notification must belong to the authenticated user.
      operationId: deleteNotification
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, example: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/notification-preferences':
    get:
      tags:
        - Notifications
      summary: Get notification preferences
      description: Thin read alias over the canonical profiles.notification_preferences store.
      operationId: getNotificationPreferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective notification preferences
          content:
            application/json:
              schema:
                type: object
                required: [success, preferences]
                properties:
                  success: { type: boolean, example: true }
                  preferences:
                    $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Notifications
      summary: Update notification preferences
      description: >
        Thin write alias over profiles.notification_preferences. Only the four
        editable keys are accepted; transactional is always server-forced true.
      operationId: updateNotificationPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                order_updates: { type: boolean }
                promotions: { type: boolean }
                collection_reminders: { type: boolean }
                onboarding_completed: { type: boolean }
      responses:
        '200':
          description: Updated notification preferences
          content:
            application/json:
              schema:
                type: object
                required: [success, preferences]
                properties:
                  success: { type: boolean, example: true }
                  preferences:
                    $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  '/admin/users':
    get:
      tags:
        - Administration
      summary: List users
      description: Retrieve a paginated list of users with their effective roles, including vendor roles derived from active memberships. Requires admin role.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Items per page
        - name: search
