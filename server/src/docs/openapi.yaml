              type: object
              required: [url, size]
              properties:
                url:
                  type: string
                  description: A vendor-assets object path such as sites/<uuid>/<file>.webp, or the signed/relative storage URL returned in a feed response
                size:
                  type: string
                  enum: [icon, thumb, card, hero]
      responses:
        '200':
          description: Fresh signed URL
          content:
            application/json:
              schema:
                type: object
