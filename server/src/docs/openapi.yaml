        estimated_prep_minutes:
          type: integer
          nullable: true
          description: Prep estimate for the first active location.
        locations:
          type: array
          items:
            $ref: '#/components/schemas/VendorLocation'
        location:
          $ref: '#/components/schemas/VendorLocation'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorLocationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_status:
          type: string
        is_active:
          type: boolean
        site_name:
          type: string
          nullable: true
        building_name:
          type: string
          nullable: true
        collection_point_name:
          type: string
          nullable: true

    VendorDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        corporate_catering_enabled:
          type: boolean
        categories:
          type: array
          items:
            type: string
        average_rating:
          type: number
          nullable: true
        rating_count:
          type: integer
        locations:
          type: array
          items:
            $ref: '#/components/schemas/VendorLocation'

    VendorInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Vendor name (used to derive the slug)
        description:
          type: string
        logo_url:
          type: string
          format: uri
        support_email:
          type: string
          format: email
        support_phone:
          type: string
        corporate_catering_enabled:
          type: boolean
        categories:
          type: array
          items:
            type: string
          maxItems: 20
          description: Names selected from the managed vendor category catalog.
        onboarding_key:
          type: string
          description: Client-generated idempotency key. Ignored on patch.
        location:
          $ref: '#/components/schemas/VendorLocationInput'
          description: Optional initial location created together with the application

    OperatingHoursItem:
      type: object
      required:
        - day_of_week
      properties:
        id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type: string
          format: time
          nullable: true
          description: Required when is_closed is false
        closes_at:
          type: string
          format: time
          nullable: true
        is_closed:
          type: boolean
          default: false

    OperatingHoursInput:
      type: array
      items:
        type: object
        required:
          - day_of_week
        properties:
          day_of_week:
            type: integer
            minimum: 0
            maximum: 6
          opens_at:
            type: string
            format: time
            description: Required together with closes_at when the day is open
          closes_at:
            type: string
            format: time
          is_closed:
            type: boolean
            default: false
      uniqueItems: true

    VendorLocation:
      type: object
      required:
        - id
        - vendor_id
        - site_id
        - building_id
      properties:
        id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        building_id:
          type: string
          format: uuid
        collection_point_id:
          type: string
          format: uuid
          nullable: true
        service_status:
          type: string
          enum: [closed, open, busy, temporarily_unavailable]
        order_cutoff_minutes:
          type: integer
          nullable: true
        estimated_prep_minutes:
          type: integer
          nullable: true
        collection_instructions:
          type: string
          nullable: true
        is_active:
          type: boolean
        site_name:
          type: string
          nullable: true
        building_name:
          type: string
          nullable: true
        collection_point_name:
          type: string
          nullable: true
        hours:
          type: array
          items:
            $ref: '#/components/schemas/OperatingHoursItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorLocationInput:
      type: object
      required:
        - site_id
        - building_id
      properties:
        site_id:
          type: string
          format: uuid
        building_id:
          type: string
          format: uuid
          description: Must belong to site_id
        collection_point_id:
          type: string
          format: uuid
          description: Must belong to building_id
        service_status:
          type: string
          enum: [closed, open, busy, temporarily_unavailable]
          default: closed
        order_cutoff_minutes:
          type: integer
          minimum: 0
        estimated_prep_minutes:
          type: integer
          minimum: 1
        collection_instructions:
          type: string
        is_active:
          type: boolean
        hours:
          $ref: '#/components/schemas/OperatingHoursInput'
