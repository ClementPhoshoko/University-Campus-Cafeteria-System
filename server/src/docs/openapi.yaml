    VendorUser:
      type: object
      required:
        - user_id
        - vendor_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [staff, manager]
        is_active:
          type: boolean
        granted_by:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          nullable: true
        full_name:
          type: string
          nullable: true
        employee_number:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    VendorUserInput:
      type: object
      oneOf:
        - required: [user_id]
        - required: [email]
      properties:
        user_id:
          type: string
          format: uuid
          description: Must not be combined with email
        email:
          type: string
          format: email
        role:
          type: string
          enum: [staff, manager]
          default: staff

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        table_name:
          type: string
        record_key:
          type: string
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: A record with these values already exists or the action conflicts with the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests; retry after the interval in the Retry-After header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - bearerAuth: []
