          type: string
          nullable: true
        support_phone:
          type: string
          nullable: true
        corporate_catering_enabled:
          type: boolean
        categories:
          type: array
          items:
            type: string
          description: Selected names from the centrally managed vendor category catalog; separate from vendor menu categories.
