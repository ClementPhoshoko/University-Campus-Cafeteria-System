    VendorOptionGroupInput:
      type: object
      required: [vendor_id, name, selection_type, is_required, min_select, max_select, options]
      properties:
        vendor_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        selection_type: { type: string, enum: [single, multiple] }
        is_required: { type: boolean }
        min_select: { type: integer, minimum: 0 }
        max_select: { type: integer, minimum: 1 }
        is_active: { type: boolean, default: true }
        options:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/VendorOptionChoiceInput' }

    VendorMenuItemConfigurationInput:
      type: object
      required: [dietary_tag_ids, allergens, option_group_ids]
