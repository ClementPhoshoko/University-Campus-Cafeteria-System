        - promotions
        - collection_reminders
        - onboarding_completed
      properties:
        transactional:
          type: boolean
          readOnly: true
          description: Always true; required order/payment messages cannot be disabled
        order_updates: { type: boolean, description: Defaults to true }
        promotions: { type: boolean, description: Defaults to false; opt-in only }
        collection_reminders: { type: boolean, description: Defaults to true }
        onboarding_completed: { type: boolean, description: Profile onboarding flag }

    Site:
      type: object
